<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: where it is honoured the keyboard resizes the layout
         viewport, so nothing has to be scrolled or shifted to clear it. Where it
         is not (iOS, mostly), src/utils/viewport.ts does the same job by hand. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- lo's own paper, the same value lo/index.html sets: the bar above this
         frame belongs to the same app as the page under it. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="lo for Even G2 — what is happening where you are." />
    <title>lo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
